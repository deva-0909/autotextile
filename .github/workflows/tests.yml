# Unit and integration tests. Each integration file boots all 15 services against its own throwaway database.
#
# Database: a throwaway Postgres inside the run by default. To run against Supabase instead, add a repository secret
# TEST_DATABASE_URL with the transaction-pooler URL of a login that may create databases, for example
#   postgres://erp_test.<project-ref>:<password>@aws-1-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=no-verify
# (see docs/testing.md). The tests then create and drop their databases there.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      database:
        description: 'Where to run: ci (throwaway Postgres in the run) or supabase (TEST_DATABASE_URL secret)'
        type: choice
        options: [ci, supabase]
        default: ci

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Against Supabase each test file sets up its own database over the network (several minutes each), so allow longer.
    timeout-minutes: ${{ inputs.database == 'supabase' && 180 || 40 }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: textile_erp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      USE_SUPABASE: ${{ github.event_name == 'workflow_dispatch' && inputs.database == 'supabase' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Postgres 17 client (the backup and restore test needs pg_dump to match the server)
        run: |
          # Ubuntu's own repositories stop at an older major version; add the PostgreSQL project's repository.
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Typecheck
        run: npx tsc --noEmit -p . && npx tsc --noEmit -p apps/web
      - name: Choose the database
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          if [ "$USE_SUPABASE" = "true" ]; then
            if [ -z "$TEST_DATABASE_URL" ]; then echo "::error::Add the TEST_DATABASE_URL repository secret to run against Supabase"; exit 1; fi
            # Supabase projects sit on one of two pooler clusters (aws-0-… or aws-1-…); the other answers
            # "tenant/user not found". Use whichever accepts the login. Credentials are never printed.
            url=""
            for cand in "$TEST_DATABASE_URL" "$(echo "$TEST_DATABASE_URL" | sed 's/@aws-1-/@aws-X-/; s/@aws-0-/@aws-1-/; s/@aws-X-/@aws-0-/')"; do
              echo "::add-mask::$cand"
              host=$(echo "$cand" | sed -E 's|^[^@]*@([^:/]+).*|\1|')
              if out=$(psql "${cand/sslmode=no-verify/sslmode=require}" -tAc 'select current_user' 2>&1); then echo "Connected through $host as $out"; url="$cand"; break; fi
              echo "Could not connect through $host: $(echo "$out" | sed -E 's|//[^@]*@|//***@|g' | head -2)"
            done
            if [ -z "$url" ]; then echo "::error::The TEST_DATABASE_URL login was refused (see above)"; exit 1; fi
            # Supabase's transaction pooler: one login, schema set per transaction, few connections per service.
            { echo "DATABASE_URL=$url"; echo "DB_ROLE_PER_SERVICE=1"; echo "PG_POOL_MAX=3"; } >> "$GITHUB_ENV"
            echo "Running against Supabase"
          else
            echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/textile_erp" >> "$GITHUB_ENV"
            echo "Running against the throwaway Postgres in this run"
          fi
      - name: Unit and integration tests
        # One file at a time everywhere: on Supabase each test database gets its own pooler pool (about 15 server
        # connections), and several at once would take the connections the live demo needs.
        run: npm test
      - name: Integration tests again through the database web API (no transaction held open; DB_TRANSPORT=rpc)
        if: env.USE_SUPABASE != 'true'
        env:
          DB_TRANSPORT: rpc
        run: npm test
      - name: Demo data loads cleanly (the same setup the live demo runs on a reload)
        if: env.USE_SUPABASE != 'true'
        run: |
          npm run setup -- --reset 2>&1 | tee setup.log
          if grep -nE '\[seed\].*(skipped|failed|did not validate|error)|Error:' setup.log; then echo "::error::The demo data did not load cleanly (see above)"; exit 1; fi
          # The demo's books should read like a trading business: sales in every month from April to last month.
          gaps=$(psql "$DATABASE_URL" -tAc "SELECT string_agg(to_char(m, 'YYYY-MM'), ', ') FROM generate_series(date '2026-04-01', date_trunc('month', current_date) - interval '1 month', interval '1 month') m WHERE NOT EXISTS (SELECT 1 FROM finance.tax_lines t WHERE t.direction = 'outward' AND date_trunc('month', t.doc_date) = m)")
          if [ -n "$gaps" ]; then echo "::error::Demo months with no sales: $gaps"; exit 1; fi
          psql "$DATABASE_URL" -tAc "SELECT to_char(m, 'YYYY-MM') || ' sales ' || round(t) FROM (SELECT date_trunc('month', doc_date) AS m, sum(taxable) AS t FROM finance.tax_lines WHERE direction = 'outward' GROUP BY 1) x ORDER BY m"
      - name: Demo data loads through the database web API (timed)
        if: env.USE_SUPABASE != 'true'
        env:
          DB_TRANSPORT: rpc
          ERP_API_STATS: '1'
        run: |
          start=$(date +%s)
          npm run setup -- --reset 2>&1 | tee setup-rpc.log | grep -E "Database API calls|STAT|✔|✖" || true
          echo "Demo load through the web API took $(( $(date +%s) - start )) s"
          if grep -nE '\[seed\].*(skipped|failed|did not validate|error)|Error:' setup-rpc.log; then echo "::error::The demo data did not load cleanly through the web API"; exit 1; fi
      - name: Drop the test databases on Supabase (also leftovers from earlier runs)
        if: always() && env.USE_SUPABASE == 'true' && env.DATABASE_URL != ''
        run: |
          url="${DATABASE_URL/sslmode=no-verify/sslmode=require}"
          for db in $(psql "$url" -tAc "SELECT datname FROM pg_database WHERE datname LIKE 'postgres\_%' AND pg_get_userbyid(datdba) = current_user"); do
            psql "$url" -qc "DROP DATABASE IF EXISTS \"$db\" WITH (FORCE)" && echo "dropped $db"
          done
